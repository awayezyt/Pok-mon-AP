openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /state:
    get:
      operationId: getCampaignState
      summary: Read the shared campaign state
      parameters:
        - name: media
          in: query
          required: false
          description: Return content-addressed image references for the current interface, or inline image data for portable legacy consumers.
          schema:
            type: string
            enum: [inline, refs]
            default: inline
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Campaign state at the returned revision
          headers:
            ETag:
              schema: { type: string }
            X-State-Revision:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignState"
        "304":
          description: Campaign revision is unchanged
        "404":
          description: Image reference was not found
    put:
      operationId: saveCampaignState
      summary: Merge a campaign-state patch
      parameters:
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
        - name: Prefer
          in: header
          required: false
          description: Request a compact acknowledgement instead of the merged state.
          schema:
            type: string
            example: return=minimal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignStateInput"
      responses:
        "200":
          description: Merged campaign state for legacy clients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignState"
        "204":
          description: State saved with a compact acknowledgement
          headers:
            ETag:
              schema: { type: string }
            X-State-Revision:
              schema: { type: string }
            X-State-Refresh-Required:
              schema: { type: string, enum: ["true", "false"] }
            Preference-Applied:
              schema: { type: string }
        "400":
          description: Invalid campaign-state payload
        "403":
          description: Player cannot update GM-only state
        "409":
          description: Image reference is no longer present in the campaign
  /media/{hash}:
    get:
      operationId: getCampaignImage
      summary: Retrieve a cached campaign image by content hash
      parameters:
        - name: hash
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-f0-9]{64}$"
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Original image bytes
          headers:
            Cache-Control:
              schema: { type: string }
            ETag:
              schema: { type: string }
          content:
            image/*:
              schema:
                type: string
                format: binary
        "304":
          description: Image has not changed
        "404":
          description: Image is no longer available
  /auth/session:
    get:
      operationId: getCampaignSession
      summary: Restore persistent campaign access
      responses:
        "200":
          description: Current access, or public when signed out
          content:
            application/json:
              schema:
                type: object
                required: [role, activeCharacterId]
                properties:
                  role:
                    type: string
                    enum: [public, player, gm]
                  activeCharacterId:
                    type: [string, "null"]
  /auth/player:
    post:
      operationId: loginCampaignPlayer
      summary: Sign in to a character and remember this browser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignPlayerLoginInput"
      responses:
        "200":
          description: Signed in
        "401":
          description: Incorrect access code
  /auth/gm:
    post:
      operationId: loginCampaignGM
      summary: Sign in as GM and remember this browser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignGMLoginInput"
      responses:
        "200":
          description: Signed in
        "401":
          description: Incorrect password
        "503":
          description: GM access not configured
  /auth/logout:
    post:
      operationId: logoutCampaign
      summary: Revoke current browser session
      responses:
        "200":
          description: Signed out
  /system/documents:
    get:
      operationId: getSystemDocuments
      summary: Fetch persisted system document edits
      responses:
        "200":
          description: System document overrides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemDocumentsResponse"
  /system/catalog:
    get:
      operationId: getSystemCatalog
      summary: Fetch the editable system index
      responses:
        "200":
          description: Persisted system index
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemCatalogResponse"
    put:
      operationId: saveSystemCatalog
      summary: Save the editable system index
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemCatalogInput"
      responses:
        "200":
          description: Saved system index
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemCatalogResponse"
        "401":
          description: Editor access required
  /system/editor-session:
    get:
      operationId: getSystemEditorSession
      summary: Check whether this browser can edit system documents
      responses:
        "200":
          description: Editor access state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemEditorSessionResponse"
    post:
      operationId: createSystemEditorSession
      summary: Unlock system editing for this browser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemEditorPasswordInput"
      responses:
        "200":
          description: Editor access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemEditorSessionResponse"
        "401":
          description: Incorrect editor password
        "503":
          description: System editor password is not configured
    delete:
      operationId: deleteSystemEditorSession
      summary: Lock system editing on this browser
      responses:
        "200":
          description: Editor access revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemEditorSessionResponse"
  /system/documents/{documentId}:
    put:
      operationId: saveSystemDocument
      summary: Save an edited system document
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemDocumentInput"
      responses:
        "200":
          description: Saved document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemDocumentResponse"
        "401":
          description: Editor access required
        "400":
          description: Invalid document payload
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    CampaignPlayerLoginInput:
      type: object
      required: [characterId, password]
      properties:
        characterId: { type: string }
        password: { type: string }
    CampaignGMLoginInput:
      type: object
      required: [password]
      properties:
        password: { type: string }
    CampaignState:
      type: object
      additionalProperties: true
    CampaignStateInput:
      type: object
      additionalProperties: true
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SystemEditorPasswordInput:
      type: object
      required: [password]
      properties:
        password:
          type: string
    SystemEditorSessionResponse:
      type: object
      required: [authorized]
      properties:
        authorized:
          type: boolean
    SystemDocumentInput:
      type: object
      required: [document]
      properties:
        document:
          $ref: "#/components/schemas/SystemDocument"
    SystemDocumentResponse:
      type: object
      required: [document]
      properties:
        document:
          $ref: "#/components/schemas/SystemDocument"
    SystemDocumentsResponse:
      type: object
      required: [documents]
      properties:
        documents:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SystemDocument"
    SystemCatalogInput:
      type: object
      required: [catalog]
      properties:
        catalog:
          $ref: "#/components/schemas/SystemCatalog"
    SystemCatalogResponse:
      type: object
      required: [catalog]
      properties:
        catalog:
          $ref: "#/components/schemas/SystemCatalog"
    SystemCatalog:
      type: object
      required: [sections, deletedDocumentIds]
      properties:
        sections:
          type: array
          items:
            $ref: "#/components/schemas/SystemIndexSection"
        deletedDocumentIds:
          type: array
          items:
            type: string
    SystemIndexSection:
      type: object
      required: [id, title, groups]
      properties:
        id:
          type: string
        title:
          type: string
        groups:
          type: array
          items:
            $ref: "#/components/schemas/SystemIndexGroup"
    SystemIndexGroup:
      type: object
      required: [title, documentIds, groups]
      properties:
        title:
          type: string
          nullable: true
        documentIds:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            $ref: "#/components/schemas/SystemIndexGroup"
    SystemDocument:
      type: object
      additionalProperties: true

